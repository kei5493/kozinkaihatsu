<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout ::base('search',~{::title},~{::body})}">
<head>
    <meta charset="UTF-8">
    <title>花検索</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<div th:fragment="search">
        <header>
            <div class="header-top">検索</div>
        </header>
        <form th:action="@{/}" th:object="${flowerSearchForm}" method="post"></form>
    <!-- 色 -->
    <div class="list-and-name">
        <label th:for="*{selectColor}">色</label>
        <div class="pulldown-wrapper">
            <select id="color" th:field="*{selectColor}">
                <option value="">選択してください</option>
                <option th:each="color : ${colorList}" 
                        th:value="${color.colorId}" 
                        th:text="${color.colorName}">
                </option>
            </select>
    </div>
    </div>
        <div>
        <button type="submit" id="searchBtn" class="btn-submit"><i class="fas fa-search"></i>検索</button>
        </div>
</div>
</form>

</body>
</html>
